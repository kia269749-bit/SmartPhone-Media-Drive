name: Build SmartPhone Media Drive APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -f app/gradle.properties

          mkdir -p app/src/main/java/com/kia269749/smartphonemediadrive
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SmartPhone-Media-Drive"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.kia269749.smartphonemediadrive"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.kia269749.smartphonemediadrive"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-ktx:1.10.1")
              implementation("com.google.android.material:material:1.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("com.google.android.gms:play-services-auth:21.3.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="SmartPhone Media Drive"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SmartPhoneMediaDrive">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="primary">#6750A4</color>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">SmartPhone Media Drive</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="Theme.SmartPhoneMediaDrive"
                  parent="Theme.Material3.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="colorPrimary">@color/primary</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/kia269749/smartphonemediadrive/MainActivity.kt <<'EOF'
          package com.kia269749.smartphonemediadrive

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.MediaStore
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.setPadding
          import com.google.android.gms.auth.api.signin.GoogleSignIn
          import com.google.android.gms.auth.api.signin.GoogleSignInAccount
          import com.google.android.gms.auth.api.signin.GoogleSignInOptions
          import com.google.android.gms.common.api.Scope
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.MultipartBody
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody
          import okhttp3.RequestBody.Companion.toRequestBody
          import okio.BufferedSink
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.net.URLEncoder

          class MainActivity : AppCompatActivity() {

              private val appScope =
                  CoroutineScope(
                      SupervisorJob() + Dispatchers.Main
                  )

              private val http =
                  OkHttpClient()

              private var googleAccount:
                  GoogleSignInAccount? = null

              private val selected =
                  mutableListOf<Uri>()

              private val uploaded =
                  mutableListOf<Uri>()

              private lateinit var status: TextView
              private lateinit var list: TextView
              private lateinit var uploadButton: Button
              private lateinit var deleteButton: Button
              private lateinit var progress: ProgressBar

              private val picker =
                  registerForActivityResult(
                      ActivityResultContracts.OpenMultipleDocuments()
                  ) { uris ->

                      if (uris.isEmpty()) return@registerForActivityResult

                      selected.clear()
                      uploaded.clear()
                      selected.addAll(uris)

                      render()

                      status.text =
                          "فایل‌ها انتخاب شدند. آماده آپلود."
                  }

              private val signIn =
                  registerForActivityResult(
                      ActivityResultContracts.StartActivityForResult()
                  ) { result ->

                      if (result.resultCode != Activity.RESULT_OK) {
                          status.text = "ورود به Google لغو شد."
                          return@registerForActivityResult
                      }

                      try {

                          val task =
                              GoogleSignIn
                                  .getSignedInAccountFromIntent(
                                      result.data
                                  )

                          googleAccount = task.result

                          status.text =
                              "Google Drive متصل شد."

                          updateButtons()

                      } catch (e: Exception) {

                          status.text =
                              "خطا در اتصال Google: ${e.message}"
                      }
                  }

              private val deleteConfirmation =
                  registerForActivityResult(
                      ActivityResultContracts.StartIntentSenderForResult()
                  ) { result ->

                      if (result.resultCode == Activity.RESULT_OK) {

                          selected.removeAll(uploaded.toSet())
                          uploaded.clear()

                          render()

                          status.text =
                              "فایل‌های تأییدشده از گوشی حذف شدند."

                      } else {

                          status.text =
                              "حذف لغو شد. فایل‌ها روی گوشی باقی ماندند."
                      }

                      updateButtons()
                  }

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  super.onCreate(savedInstanceState)

                  createUi()

                  googleAccount =
                      GoogleSignIn.getLastSignedInAccount(this)

                  render()
                  updateButtons()
              }

              private fun createUi() {

                  val root =
                      LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(24)
                      }

                  val title =
                      TextView(this).apply {
                          text = "SmartPhone Media Drive"
                          textSize = 25f
                          setPadding(0, 0, 0, 18)
                      }

                  status =
                      TextView(this).apply {
                          text =
                              "عکس و فیلم را انتخاب کن و فایل اصلی را بدون تبدیل به Google Drive بفرست."
                          textSize = 16f
                          setPadding(0, 0, 0, 18)
                      }

                  val googleButton =
                      Button(this).apply {
                          text = "اتصال به Google Drive"
                          setOnClickListener {
                              connectGoogle()
                          }
                      }

                  val selectButton =
                      Button(this).apply {
                          text = "انتخاب عکس و فیلم"
                          setOnClickListener {
                              picker.launch(
                                  arrayOf(
                                      "image/*",
                                      "video/*"
                                  )
                              )
                          }
                      }

                  uploadButton =
                      Button(this).apply {
                          text = "آپلود به Google Drive"
                          setOnClickListener {
                              uploadAll()
                          }
                      }

                  deleteButton =
                      Button(this).apply {
                          text = "تأیید حذف از گوشی"
                          setOnClickListener {
                              askDelete()
                          }
                      }

                  progress =
                      ProgressBar(this).apply {
                          visibility = View.GONE
                      }

                  list =
                      TextView(this).apply {
                          textSize = 15f
                          setPadding(0, 18, 0, 18)
                      }

                  root.addView(title)
                  root.addView(status)
                  root.addView(googleButton)
                  root.addView(selectButton)
                  root.addView(uploadButton)
                  root.addView(deleteButton)
                  root.addView(progress)

                  val scroll =
                      ScrollView(this).apply {
                          addView(list)
                      }

                  root.addView(
                      scroll,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  setContentView(root)
              }

              private fun connectGoogle() {

                  val options =
                      GoogleSignInOptions.Builder(
                          GoogleSignInOptions.DEFAULT_SIGN_IN
                      )
                          .requestScopes(
                              Scope(
                                  "https://www.googleapis.com/auth/drive.file"
                              )
                          )
                          .build()

                  val client =
                      GoogleSignIn.getClient(
                          this,
                          options
                      )

                  signIn.launch(client.signInIntent)
              }

              private fun uploadAll() {

                  val account =
                      googleAccount ?: run {
                          status.text =
                              "ابتدا به Google Drive وصل شو."
                          return
                      }

                  if (selected.isEmpty()) return

                  uploadButton.isEnabled = false
                  progress.visibility = View.VISIBLE

                  appScope.launch {

                      try {

                          val folderId =
                              withContext(Dispatchers.IO) {
                                  getOrCreateFolder(
                                      account,
                                      "SmartPhone Media Drive"
                                  )
                              }

                          uploaded.clear()

                          selected.forEachIndexed {
                                  index,
                                  uri ->

                              status.text =
                                  "در حال آپلود ${index + 1} از ${selected.size}..."

                              withContext(Dispatchers.IO) {
                                  uploadFile(
                                      account,
                                      uri,
                                      folderId
                                  )
                              }

                              uploaded.add(uri)
                              render()
                          }

                          status.text =
                              "آپلود کامل شد. Google Drive را بررسی کن. تا تأیید نکنی هیچ فایلی حذف نمی‌شود."

                          deleteButton.isEnabled =
                              uploaded.isNotEmpty()

                      } catch (e: Exception) {

                          status.text =
                              "خطا: ${e.message}"

                          deleteButton.isEnabled = false

                      } finally {

                          progress.visibility = View.GONE
                          uploadButton.isEnabled =
                              selected.isNotEmpty()
                      }
                  }
              }

              private fun getToken(
                  account: GoogleSignInAccount
              ): String {

                  val scope =
                      "oauth2:https://www.googleapis.com/auth/drive.file"

                  return com.google.android.gms.auth.GoogleAuthUtil
                      .getToken(
                          this,
                          account.account,
                          scope
                      )
              }

              private fun getOrCreateFolder(
                  account: GoogleSignInAccount,
                  name: String
              ): String {

                  val token = getToken(account)

                  val escaped =
                      name.replace("'", "\\'")

                  val query =
                      "'root' in parents " +
                      "and name = '$escaped' " +
                      "and mimeType = " +
                      "'application/vnd.google-apps.folder' " +
                      "and trashed = false"

                  val url =
                      "https://www.googleapis.com/drive/v3/files" +
                      "?q=" +
                      URLEncoder.encode(query, "UTF-8") +
                      "&spaces=drive" +
                      "&pageSize=1" +
                      "&fields=files(id,name)"

                  val request =
                      Request.Builder()
                          .url(url)
                          .header(
                              "Authorization",
                              "Bearer $token"
                          )
                          .get()
                          .build()

                  http.newCall(request)
                      .execute()
                      .use { response ->

                          if (!response.isSuccessful) {
                              throw IOException(
                                  "Folder search HTTP ${response.code}"
                              )
                          }

                          val json =
                              JSONObject(
                                  response.body?.string()
                                      ?: "{}"
                              )

                          val files =
                              json.optJSONArray("files")

                          if (
                              files != null &&
                              files.length() > 0
                          ) {

                              return files
                                  .getJSONObject(0)
                                  .getString("id")
                          }
                      }

                  val metadata =
                      JSONObject()
                          .put("name", name)
                          .put(
                              "mimeType",
                              "application/vnd.google-apps.folder"
                          )
                          .toString()
                          .toRequestBody(
                              "application/json".toMediaType()
                          )

                  val create =
                      Request.Builder()
                          .url(
                              "https://www.googleapis.com/drive/v3/files"
                          )
                          .header(
                              "Authorization",
                              "Bearer $token"
                          )
                          .post(metadata)
                          .build()

                  http.newCall(create)
                      .execute()
                      .use { response ->

                          if (!response.isSuccessful) {
                              throw IOException(
                                  "Folder creation HTTP ${response.code}"
                              )
                          }

                          return JSONObject(
                              response.body?.string()
                                  ?: "{}"
                          ).getString("id")
                      }
              }

              private fun uploadFile(
                  account: GoogleSignInAccount,
                  uri: Uri,
                  folderId: String
              ) {

                  val token = getToken(account)

                  val name =
                      getDisplayName(uri)

                  val mime =
                      contentResolver.getType(uri)
                          ?: "application/octet-stream"

                  val metadata =
                      JSONObject()
                          .put("name", name)
                          .put(
                              "parents",
                              JSONArray().put(folderId)
                          )
                          .toString()

                  val media =
                      object : RequestBody() {

                          override fun contentType() =
                              mime.toMediaType()

                          override fun contentLength() =
                              getLength(uri)

                          override fun writeTo(
                              sink: BufferedSink
                          ) {

                              contentResolver
                                  .openInputStream(uri)
                                  ?.use { input ->

                                      val buffer =
                                          ByteArray(64 * 1024)

                                      while (true) {

                                          val count =
                                              input.read(buffer)

                                          if (count <= 0) {
                                              break
                                          }

                                          sink.write(
                                              buffer,
                                              0,
                                              count
                                          )
                                      }
                                  }
                                  ?: throw IOException(
                                      "Cannot read selected file"
                                  )
                          }
                      }

                  val body =
                      MultipartBody.Builder()
                          .setType(
                              "multipart/related".toMediaType()
                          )
                          .addPart(
                              okhttp3.Headers.headersOf(
                                  "Content-Type",
                                  "application/json; charset=UTF-8"
                              ),
                              metadata.toRequestBody(
                                  "application/json; charset=UTF-8"
                                      .toMediaType()
                              )
                          )
                          .addPart(
                              okhttp3.Headers.headersOf(
                                  "Content-Type",
                                  mime
                              ),
                              media
                          )
                          .build()

                  val request =
                      Request.Builder()
                          .url(
                              "https://www.googleapis.com/upload/drive/v3/files" +
                              "?uploadType=multipart"
                          )
                          .header(
                              "Authorization",
                              "Bearer $token"
                          )
                          .header(
                              "Accept",
                              "application/json"
                          )
                          .post(body)
                          .build()

                  http.newCall(request)
                      .execute()
                      .use { response ->

                          if (!response.isSuccessful) {
                              throw IOException(
                                  "Upload HTTP ${response.code}: " +
                                  response.body?.string()
                              )
                          }
                      }
              }

              private fun getDisplayName(
                  uri: Uri
              ): String {

                  contentResolver.query(
                      uri,
                      arrayOf(
                          android.provider.OpenableColumns.DISPLAY_NAME
                      ),
                      null,
                      null,
                      null
                  )?.use { cursor ->

                      if (cursor.moveToFirst()) {

                          val index =
                              cursor.getColumnIndex(
                                  android.provider.OpenableColumns.DISPLAY_NAME
                              )

                          if (index >= 0) {
                              return cursor.getString(index)
                          }
                      }
                  }

                  return uri.lastPathSegment ?: "media"
              }

              private fun getLength(
                  uri: Uri
              ): Long {

                  return try {

                      contentResolver
                          .openAssetFileDescriptor(
                              uri,
                              "r"
                          )
                          ?.use { it.length }
                          ?: -1L

                  } catch (_: Exception) {
                      -1L
                  }
              }

              private fun askDelete() {

                  if (uploaded.isEmpty()) return

                  AlertDialog.Builder(this)
                      .setTitle("تأیید نهایی حذف")
                      .setMessage(
                          "آپلود انجام شده است.\n\n" +
                          "آیا Google Drive را بررسی کرده‌ای و " +
                          "می‌خواهی فایل‌های آپلودشده از گوشی حذف شوند؟"
                      )
                      .setNegativeButton(
                          "لغو",
                          null
                      )
                      .setPositiveButton(
                          "بله، حذف کن"
                      ) { _, _ ->
                          deleteFiles()
                      }
                      .show()
              }

              private fun deleteFiles() {

                  val uris =
                      uploaded.toList()

                  if (uris.isEmpty()) return

                  try {

                      if (
                          android.os.Build.VERSION.SDK_INT >= 30
                      ) {

                          val request =
                              MediaStore.createDeleteRequest(
                                  contentResolver,
                                  uris
                              )

                          deleteConfirmation.launch(
                              androidx.activity.result.IntentSenderRequest
                                  .Builder(
                                      request.intentSender
                                  )
                                  .build()
                          )

                          return
                      }

                  } catch (_: Exception) {
                  }

                  var count = 0

                  uris.forEach { uri ->

                      try {

                          if (
                              contentResolver.delete(
                                  uri,
                                  null,
                                  null
                              ) > 0
                          ) {
                              count++
                          }

                      } catch (_: Exception) {
                      }
                  }

                  selected.removeAll(uris.toSet())
                  uploaded.clear()

                  render()

                  status.text =
                      "حذف انجام شد: $count فایل."

                  updateButtons()
              }

              private fun render() {

                  if (selected.isEmpty()) {

                      list.text =
                          "هیچ فایلی انتخاب نشده."

                      updateButtons()
                      return
                  }

                  val text =
                      StringBuilder(
                          "فایل‌های انتخاب‌شده:\n\n"
                      )

                  selected.forEachIndexed {
                          index,
                          uri ->

                      val isUploaded =
                          uploaded.contains(uri)

                      text.append(
                          "${index + 1}. "
                      )

                      text.append(
                          getDisplayName(uri)
                      )

                      text.append(
                          if (isUploaded)
                              "  ✓ آپلود شد"
                          else
                              "  • در انتظار"
                      )

                      text.append("\n")
                  }

                  list.text =
                      text.toString()

                  updateButtons()
              }

              private fun updateButtons() {

                  uploadButton.isEnabled =
                      selected.isNotEmpty() &&
                      googleAccount != null &&
                      progress.visibility != View.VISIBLE

                  deleteButton.isEnabled =
                      uploaded.isNotEmpty()
              }

              override fun onDestroy() {

                  appScope.cancel()

                  super.onDestroy()
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPhone-Media-Drive-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
