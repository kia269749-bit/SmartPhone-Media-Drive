name: Build SmartPhone Media Drive APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf app
          mkdir -p app/src/main/java/com/smartphone/mediadrive
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SmartPhoneMediaDrive"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.smartphone.mediadrive"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.smartphone.mediadrive"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("com.google.android.gms:play-services-auth:21.3.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">SmartPhone Media Drive</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/smartphone/mediadrive/MainActivity.java <<'EOF'
          package com.smartphone.mediadrive;

          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.provider.OpenableColumns;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.annotation.Nullable;
          import androidx.appcompat.app.AppCompatActivity;

          import com.google.android.gms.auth.GoogleAuthUtil;
          import com.google.android.gms.auth.api.signin.GoogleSignIn;
          import com.google.android.gms.auth.api.signin.GoogleSignInAccount;
          import com.google.android.gms.auth.api.signin.GoogleSignInOptions;
          import com.google.android.gms.common.api.ApiException;
          import com.google.android.gms.common.api.Scope;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.IOException;
          import java.io.InputStream;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          import okhttp3.MediaType;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.RequestBody;
          import okhttp3.Response;
          import okio.BufferedSink;

          public class MainActivity extends AppCompatActivity {

              private static final int PICK_MEDIA = 100;
              private static final int SIGN_IN = 101;
              private static final int DELETE_REQUEST = 102;

              private static final String DRIVE_SCOPE =
                      "https://www.googleapis.com/auth/drive.file";

              private final ArrayList<Uri> selectedFiles = new ArrayList<>();
              private final ExecutorService executor = Executors.newSingleThreadExecutor();
              private final OkHttpClient http = new OkHttpClient();

              private GoogleSignInAccount account;

              private TextView status;
              private TextView selectedText;
              private ProgressBar progress;
              private Button connectButton;
              private Button pickButton;
              private Button uploadButton;
              private Button deleteButton;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  buildUi();

                  account = GoogleSignIn.getLastSignedInAccount(this);

                  if (account != null) {
                      setStatus("Google متصل است: " + account.getEmail());
                  } else {
                      setStatus("ابتدا به Google متصل شوید.");
                  }
              }

              private void buildUi() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(40, 40, 40, 40);

                  TextView title = new TextView(this);
                  title.setText("SmartPhone Media Drive");
                  title.setTextSize(26);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText(
                          "عکس و فیلم را انتخاب کنید.\n" +
                          "فایل اصلی بدون تبدیل به Google Drive فرستاده می‌شود.\n" +
                          "بعد از بررسی شما، حذف فایل از گوشی انجام می‌شود."
                  );
                  info.setTextSize(16);
                  info.setPadding(0, 30, 0, 30);
                  root.addView(info);

                  connectButton = new Button(this);
                  connectButton.setText("اتصال به Google Drive");
                  connectButton.setOnClickListener(v -> signIn());
                  root.addView(connectButton);

                  pickButton = new Button(this);
                  pickButton.setText("انتخاب عکس و فیلم");
                  pickButton.setOnClickListener(v -> pickMedia());
                  root.addView(pickButton);

                  selectedText = new TextView(this);
                  selectedText.setText("هنوز فایلی انتخاب نشده است.");
                  selectedText.setTextSize(15);
                  selectedText.setPadding(0, 20, 0, 20);
                  root.addView(selectedText);

                  uploadButton = new Button(this);
                  uploadButton.setText("آپلود به Google Drive");
                  uploadButton.setOnClickListener(v -> uploadFiles());
                  root.addView(uploadButton);

                  deleteButton = new Button(this);
                  deleteButton.setText("حذف فایل‌های انتخاب‌شده از گوشی");
                  deleteButton.setOnClickListener(v -> deleteFiles());
                  root.addView(deleteButton);

                  progress = new ProgressBar(this);
                  progress.setVisibility(View.GONE);
                  root.addView(progress);

                  status = new TextView(this);
                  status.setTextSize(15);
                  status.setPadding(0, 25, 0, 0);
                  root.addView(status);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);

                  setContentView(scroll);
              }

              private void signIn() {
                  GoogleSignInOptions options =
                          new GoogleSignInOptions.Builder(
                                  GoogleSignInOptions.DEFAULT_SIGN_IN)
                                  .requestEmail()
                                  .requestScopes(new Scope(DRIVE_SCOPE))
                                  .build();

                  Intent intent =
                          GoogleSignIn.getClient(this, options).getSignInIntent();

                  startActivityForResult(intent, SIGN_IN);
              }

              private void pickMedia() {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.setType("*/*");
                  intent.putExtra(
                          Intent.EXTRA_MIME_TYPES,
                          new String[]{"image/*", "video/*"}
                  );
                  intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);

                  startActivityForResult(intent, PICK_MEDIA);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      @Nullable Intent data) {

                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == SIGN_IN) {
                      if (resultCode != RESULT_OK || data == null) {
                          setStatus("اتصال به Google لغو شد.");
                          return;
                      }

                      try {
                          account =
                                  GoogleSignIn
                                          .getSignedInAccountFromIntent(data)
                                          .getResult(ApiException.class);

                          if (account != null) {
                              setStatus(
                                      "Google متصل شد: " +
                                              account.getEmail()
                              );
                          }

                      } catch (ApiException e) {
                          setStatus(
                                  "خطا در اتصال Google: " +
                                          e.getStatusCode()
                          );
                      }

                      return;
                  }

                  if (requestCode == PICK_MEDIA) {
                      if (resultCode != RESULT_OK || data == null) {
                          return;
                      }

                      selectedFiles.clear();

                      if (data.getClipData() != null) {
                          int count = data.getClipData().getItemCount();

                          for (int i = 0; i < count; i++) {
                              Uri uri = data.getClipData().getItemAt(i).getUri();
                              selectedFiles.add(uri);
                              takePermission(uri);
                          }

                      } else if (data.getData() != null) {
                          Uri uri = data.getData();
                          selectedFiles.add(uri);
                          takePermission(uri);
                      }

                      updateSelectedText();
                      setStatus(
                              selectedFiles.size() +
                                      " فایل انتخاب شد."
                      );

                      return;
                  }

                  if (requestCode == DELETE_REQUEST) {
                      setStatus(
                              "درخواست حذف توسط سیستم Android پردازش شد."
                      );
                  }
              }

              private void takePermission(Uri uri) {
                  try {
                      int flags =
                              Intent.FLAG_GRANT_READ_URI_PERMISSION |
                                      Intent.FLAG_GRANT_WRITE_URI_PERMISSION;

                      getContentResolver()
                              .takePersistableUriPermission(uri, flags);

                  } catch (Exception ignored) {
                  }
              }

              private void updateSelectedText() {
                  if (selectedFiles.isEmpty()) {
                      selectedText.setText(
                              "هنوز فایلی انتخاب نشده است."
                      );
                      return;
                  }

                  StringBuilder text = new StringBuilder();
                  text.append("فایل‌های انتخاب‌شده:\n\n");

                  for (int i = 0; i < selectedFiles.size(); i++) {
                      text.append(i + 1)
                              .append(". ")
                              .append(getFileName(selectedFiles.get(i)))
                              .append("\n");
                  }

                  selectedText.setText(text.toString());
              }

              private void uploadFiles() {
                  if (account == null) {
                      Toast.makeText(
                              this,
                              "ابتدا به Google متصل شوید.",
                              Toast.LENGTH_LONG
                      ).show();
                      return;
                  }

                  if (selectedFiles.isEmpty()) {
                      Toast.makeText(
                              this,
                              "ابتدا عکس یا فیلم انتخاب کنید.",
                              Toast.LENGTH_LONG
                      ).show();
                      return;
                  }

                  setBusy(true);
                  setStatus("در حال آماده‌سازی Google Drive...");

                  executor.execute(() -> {
                      try {
                          String token = getAccessToken();
                          String folderId = findOrCreateFolder(token);

                          int total = selectedFiles.size();
                          int done = 0;

                          for (Uri uri : selectedFiles) {
                              String name = getFileName(uri);
                              setStatusOnUi(
                                      "در حال آپلود: " +
                                              name +
                                              "\n" +
                                              (done + 1) +
                                              " از " +
                                              total
                              );

                              uploadFile(token, folderId, uri);
                              done++;
                          }

                          setStatusOnUi(
                                  "آپلود همه فایل‌ها با موفقیت انجام شد.\n" +
                                          "حالا Google Drive را بررسی کنید."
                          );

                      } catch (Exception e) {
                          setStatusOnUi(
                                  "خطا در آپلود:\n" +
                                          e.getMessage()
                          );

                      } finally {
                          runOnUiThread(() -> setBusy(false));
                      }
                  });
              }

              private String getAccessToken() throws Exception {
                  if (account == null || account.getAccount() == null) {
                      throw new Exception("حساب Google پیدا نشد.");
                  }

                  return GoogleAuthUtil.getToken(
                          this,
                          account.getAccount(),
                          "oauth2:" + DRIVE_SCOPE
                  );
              }

              private String findOrCreateFolder(String token)
                      throws Exception {

                  String folderName = "SmartPhone Media Drive";

                  String query =
                          "name='" +
                                  folderName.replace("'", "\\'") +
                                  "' and " +
                                  "mimeType='application/vnd.google-apps.folder' and " +
                                  "trashed=false";

                  String url =
                          "https://www.googleapis.com/drive/v3/files" +
                                  "?q=" +
                                  URLEncoder.encode(
                                          query,
                                          StandardCharsets.UTF_8.name()
                                  ) +
                                  "&fields=files(id,name)";

                  Request request = new Request.Builder()
                          .url(url)
                          .header(
                                  "Authorization",
                                  "Bearer " + token
                          )
                          .get()
                          .build();

                  try (Response response = http.newCall(request).execute()) {

                      if (!response.isSuccessful()) {
                          throw new Exception(
                                  "خطا در پیدا کردن پوشه: HTTP " +
                                          response.code()
                          );
                      }

                      String body = response.body() == null
                              ? ""
                              : response.body().string();

                      JSONObject json = new JSONObject(body);
                      JSONArray files = json.optJSONArray("files");

                      if (files != null && files.length() > 0) {
                          return files
                                  .getJSONObject(0)
                                  .getString("id");
                      }
                  }

                  JSONObject metadata = new JSONObject();
                  metadata.put("name", folderName);
                  metadata.put(
                          "mimeType",
                          "application/vnd.google-apps.folder"
                  );

                  RequestBody body = RequestBody.create(
                          metadata.toString(),
                          MediaType.parse("application/json")
                  );

                  Request create = new Request.Builder()
                          .url(
                                  "https://www.googleapis.com/drive/v3/files"
                          )
                          .header(
                                  "Authorization",
                                  "Bearer " + token
                          )
                          .post(body)
                          .build();

                  try (Response response =
                               http.newCall(create).execute()) {

                      if (!response.isSuccessful()) {
                          throw new Exception(
                                  "خطا در ساخت پوشه: HTTP " +
                                          response.code()
                          );
                      }

                      String result =
                              response.body() == null
                                      ? ""
                                      : response.body().string();

                      return new JSONObject(result).getString("id");
                  }
              }

              private void uploadFile(
                      String token,
                      String folderId,
                      Uri uri) throws Exception {

                  ContentResolver resolver = getContentResolver();

                  String name = getFileName(uri);
                  String mime = resolver.getType(uri);

                  if (TextUtils.isEmpty(mime)) {
                      mime = "application/octet-stream";
                  }

                  long length = getFileLength(uri);

                  JSONObject metadata = new JSONObject();
                  metadata.put("name", name);

                  JSONArray parents = new JSONArray();
                  parents.put(folderId);
                  metadata.put("parents", parents);

                  RequestBody metadataBody =
                          RequestBody.create(
                                  metadata.toString(),
                                  MediaType.parse(
                                          "application/json; charset=UTF-8"
                                  )
                          );

                  Request init = new Request.Builder()
                          .url(
                                  "https://www.googleapis.com/upload/drive/v3/files" +
                                          "?uploadType=resumable"
                          )
                          .header(
                                  "Authorization",
                                  "Bearer " + token
                          )
                          .header(
                                  "X-Upload-Content-Type",
                                  mime
                          )
                          .header(
                                  "X-Upload-Content-Length",
                                  String.valueOf(length)
                          )
                          .post(metadataBody)
                          .build();

                  String uploadUrl;

                  try (Response response =
                               http.newCall(init).execute()) {

                      if (!response.isSuccessful()) {
                          throw new Exception(
                                  "شروع آپلود ناموفق بود: HTTP " +
                                          response.code()
                          );
                      }

                      uploadUrl = response.header("Location");

                      if (TextUtils.isEmpty(uploadUrl)) {
                          throw new Exception(
                                  "Google Drive آدرس آپلود را برنگرداند."
                          );
                      }
                  }

                  RequestBody fileBody =
                          new UriRequestBody(
                                  resolver,
                                  uri,
                                  mime,
                                  length
                          );

                  Request upload = new Request.Builder()
                          .url(uploadUrl)
                          .header(
                                  "Authorization",
                                  "Bearer " + token
                          )
                          .put(fileBody)
                          .build();

                  try (Response response =
                               http.newCall(upload).execute()) {

                      if (!response.isSuccessful()) {
                          String error =
                                  response.body() == null
                                          ? ""
                                          : response.body().string();

                          throw new Exception(
                                  "آپلود فایل ناموفق بود: HTTP " +
                                          response.code() +
                                          "\n" +
                                          error
                          );
                      }
                  }
              }

              private long getFileLength(Uri uri) {
                  Cursor cursor = getContentResolver().query(
                          uri,
                          new String[]{
                                  OpenableColumns.SIZE
                          },
                          null,
                          null,
                          null
                  );

                  if (cursor != null) {
                      try {
                          if (cursor.moveToFirst()) {
                              int index =
                                      cursor.getColumnIndex(
                                              OpenableColumns.SIZE
                                      );

                              if (index >= 0 &&
                                      !cursor.isNull(index)) {
                                  return cursor.getLong(index);
                              }
                          }
                      } finally {
                          cursor.close();
                      }
                  }

                  return -1;
              }

              private String getFileName(Uri uri) {
                  Cursor cursor = getContentResolver().query(
                          uri,
                          new String[]{
                                  OpenableColumns.DISPLAY_NAME
                          },
                          null,
                          null,
                          null
                  );

                  if (cursor != null) {
                      try {
                          if (cursor.moveToFirst()) {
                              int index =
                                      cursor.getColumnIndex(
                                              OpenableColumns.DISPLAY_NAME
                                      );

                              if (index >= 0) {
                                  String name = cursor.getString(index);

                                  if (!TextUtils.isEmpty(name)) {
                                      return name;
                                  }
                              }
                          }
                      } finally {
                          cursor.close();
                      }
                  }

                  String last = uri.getLastPathSegment();

                  return TextUtils.isEmpty(last)
                          ? "media_file"
                          : last;
              }

              private void deleteFiles() {
                  if (selectedFiles.isEmpty()) {
                      Toast.makeText(
                              this,
                              "فایلی برای حذف انتخاب نشده است.",
                              Toast.LENGTH_LONG
                      ).show();
                      return;
                  }

                  new androidx.appcompat.app.AlertDialog.Builder(this)
                          .setTitle("تأیید حذف")
                          .setMessage(
                                  "آیا مطمئن هستید که فایل‌های انتخاب‌شده " +
                                          "از گوشی حذف شوند؟\n\n" +
                                          "فقط بعد از تأیید شما حذف انجام می‌شود."
                          )
                          .setNegativeButton(
                                  "لغو",
                                  null
                          )
                          .setPositiveButton(
                                  "حذف",
                                  (dialog, which) -> performDelete()
                          )
                          .show();
              }

              private void performDelete() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {

                      try {
                          ArrayList<Uri> list =
                                  new ArrayList<>(selectedFiles);

                          Intent intent =
                                  MediaStore.createDeleteRequest(
                                          getContentResolver(),
                                          list
                                  );

                          startIntentSenderForResult(
                                  intent.getIntentSender(),
                                  DELETE_REQUEST,
                                  null,
                                  0,
                                  0,
                                  0
                          );

                      } catch (Exception e) {
                          setStatus(
                                  "خطا در درخواست حذف:\n" +
                                          e.getMessage()
                          );
                      }

                  } else {

                      int deleted = 0;

                      for (Uri uri : selectedFiles) {
                          try {
                              deleted += getContentResolver()
                                      .delete(uri, null, null);
                          } catch (Exception ignored) {
                          }
                      }

                      setStatus(
                              deleted +
                                      " فایل حذف شد."
                      );
                  }
              }

              private void setBusy(boolean busy) {
                  runOnUiThread(() -> {
                      progress.setVisibility(
                              busy
                                      ? View.VISIBLE
                                      : View.GONE
                      );

                      connectButton.setEnabled(!busy);
                      pickButton.setEnabled(!busy);
                      uploadButton.setEnabled(!busy);
                      deleteButton.setEnabled(!busy);
                  });
              }

              private void setStatus(String text) {
                  status.setText(text);
              }

              private void setStatusOnUi(String text) {
                  runOnUiThread(() -> status.setText(text));
              }

              @Override
              protected void onDestroy() {
                  executor.shutdownNow();
                  super.onDestroy();
              }

              private static class UriRequestBody
                      extends RequestBody {

                  private final ContentResolver resolver;
                  private final Uri uri;
                  private final String mime;
                  private final long length;

                  UriRequestBody(
                          ContentResolver resolver,
                          Uri uri,
                          String mime,
                          long length) {
                      this.resolver = resolver;
                      this.uri = uri;
                      this.mime = mime;
                      this.length = length;
                  }

                  @Override
                  public MediaType contentType() {
                      return MediaType.parse(mime);
                  }

                  @Override
                  public long contentLength() {
                      return length;
                  }

                  @Override
                  public void writeTo(
                          BufferedSink sink) throws IOException {

                      try (InputStream input =
                                   resolver.openInputStream(uri)) {

                          if (input == null) {
                              throw new IOException(
                                      "فایل قابل خواندن نیست."
                              );
                          }

                          byte[] buffer =
                                  new byte[64 * 1024];

                          int read;

                          while ((read =
                                  input.read(buffer)) != -1) {
                              sink.write(buffer, 0, read);
                          }
                      }
                  }
              }
          }
          EOF

      - name: Check generated project
        run: |
          echo "===== PROJECT CHECK ====="
          find app/src/main -type f -maxdepth 10 -print
          echo "========================="

      - name: Build Debug APK
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartPhone-Media-Drive-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
